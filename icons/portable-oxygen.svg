<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Основной баллон -->
  <rect x="40" y="25" width="40" height="60" rx="6" fill="#8B5CF6" stroke="#7C3AED" stroke-width="2"/>
  
  <!-- Верхняя часть баллона -->
  <rect x="42" y="20" width="36" height="12" rx="6" fill="#A78BFA" stroke="#7C3AED" stroke-width="2"/>
  
  <!-- Клапан -->
  <circle cx="60" cy="26" r="3" fill="#7C3AED"/>
  <rect x="58" y="23" width="4" height="6" fill="#7C3AED"/>
  
  <!-- Полоски на баллоне -->
  <rect x="42" y="40" width="36" height="2" fill="#7C3AED" opacity="0.3"/>
  <rect x="42" y="50" width="36" height="2" fill="#7C3AED" opacity="0.3"/>
  <rect x="42" y="60" width="36" height="2" fill="#7C3AED" opacity="0.3"/>
  
  <!-- Молекула кислорода O2 -->
  <g transform="translate(85, 30)">
    <circle cx="0" cy="0" r="5" fill="#EC4899"/>
    <circle cx="12" cy="0" r="5" fill="#EC4899"/>
    <line x1="5" y1="0" x2="7" y2="0" stroke="#EC4899" stroke-width="2"/>
  </g>
  
  <!-- Портативная ручка -->
  <rect x="55" y="15" width="10" height="8" rx="2" fill="#6B7280"/>
  <rect x="58" y="12" width="4" height="3" fill="#6B7280"/>
  
  <!-- Ремень -->
  <path d="M 30 50 Q 60 45 90 50" stroke="#9CA3AF" stroke-width="3" fill="none"/>
  <path d="M 30 55 Q 60 50 90 55" stroke="#9CA3AF" stroke-width="3" fill="none"/>
  
  <!-- Подставка -->
  <rect x="35" y="85" width="50" height="6" rx="3" fill="#6B7280"/>
  
  <!-- Тень -->
  <ellipse cx="60" cy="95" rx="30" ry="6" fill="#000000" opacity="0.1"/>
  
  <!-- Этикетка -->
  <rect x="45" y="70" width="30" height="10" rx="2" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="60" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#374151">PORTABLE</text>
  
  <!-- Мобильный значок -->
  <g transform="translate(25, 35)">
    <rect x="0" y="0" width="8" height="12" rx="2" fill="#10B981"/>
    <rect x="1" y="2" width="6" height="8" fill="#34D399"/>
    <circle cx="4" cy="6" r="1" fill="#10B981"/>
  </g>
</svg>
