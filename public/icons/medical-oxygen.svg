<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Основной баллон -->
  <rect x="30" y="20" width="60" height="75" rx="8" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- Верхняя часть баллона -->
  <rect x="35" y="15" width="50" height="15" rx="8" fill="#60A5FA" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- Клапан -->
  <circle cx="60" cy="22" r="4" fill="#1E40AF"/>
  <rect x="58" y="18" width="4" height="8" fill="#1E40AF"/>
  
  <!-- Полоски на баллоне -->
  <rect x="35" y="35" width="50" height="3" fill="#1E40AF" opacity="0.3"/>
  <rect x="35" y="45" width="50" height="3" fill="#1E40AF" opacity="0.3"/>
  <rect x="35" y="55" width="50" height="3" fill="#1E40AF" opacity="0.3"/>
  <rect x="35" y="65" width="50" height="3" fill="#1E40AF" opacity="0.3"/>
  
  <!-- Молекула кислорода O2 -->
  <g transform="translate(75, 30)">
    <!-- Атомы кислорода -->
    <circle cx="0" cy="0" r="6" fill="#10B981"/>
    <circle cx="15" cy="0" r="6" fill="#10B981"/>
    <!-- Связь -->
    <line x1="6" y1="0" x2="9" y2="0" stroke="#10B981" stroke-width="2"/>
  </g>
  
  <!-- Медицинский крест -->
  <g transform="translate(60, 50)">
    <rect x="-8" y="-2" width="16" height="4" fill="#EF4444"/>
    <rect x="-2" y="-8" width="4" height="16" fill="#EF4444"/>
  </g>
  
  <!-- Подставка -->
  <rect x="20" y="95" width="80" height="8" rx="4" fill="#6B7280"/>
  
  <!-- Тень -->
  <ellipse cx="60" cy="110" rx="45" ry="8" fill="#000000" opacity="0.1"/>
  
  <!-- Этикетка -->
  <rect x="40" y="75" width="40" height="12" rx="2" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="60" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#374151">MEDICAL</text>
</svg>
