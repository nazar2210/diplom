<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Основной баллон -->
  <rect x="4" y="3" width="8" height="10" rx="1" fill="#3B82F6" stroke="#1E40AF" stroke-width="0.5"/>
  
  <!-- Верхняя часть баллона -->
  <rect x="5" y="2" width="6" height="2" rx="1" fill="#60A5FA" stroke="#1E40AF" stroke-width="0.5"/>
  
  <!-- Клапан -->
  <circle cx="8" cy="3" r="0.75" fill="#1E40AF"/>
  
  <!-- Полоски на баллоне -->
  <rect x="4.5" y="5" width="7" height="0.5" fill="#1E40AF" opacity="0.3"/>
  <rect x="4.5" y="7" width="7" height="0.5" fill="#1E40AF" opacity="0.3"/>
  <rect x="4.5" y="9" width="7" height="0.5" fill="#1E40AF" opacity="0.3"/>
  
  <!-- Молекула кислорода O2 -->
  <g transform="translate(10, 4)">
    <circle cx="0" cy="0" r="1" fill="#10B981"/>
    <circle cx="3" cy="0" r="1" fill="#10B981"/>
    <line x1="1" y1="0" x2="2" y2="0" stroke="#10B981" stroke-width="0.5"/>
  </g>
  
  <!-- Подставка -->
  <rect x="3" y="13" width="10" height="1" rx="0.5" fill="#6B7280"/>
</svg>
